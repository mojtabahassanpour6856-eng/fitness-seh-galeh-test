name: Recovery SQL compile check

on:
  workflow_dispatch:
  push:
    branches:
      - fix/trainee-password-recovery-ui-20261122
      - review/recovery-code-envelope-tests-20261123
      - implementation/recovery-no-sms-db-candidate-20261123
    paths:
      - 'experiments/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/trainee-password-recovery/**'
      - '.github/workflows/recovery-sql-compile.yml'
  pull_request:
    branches:
      - fix/trainee-password-recovery-ui-20261122
      - integration/full-app-mirror-20261115
    paths:
      - 'experiments/**'
      - '.github/workflows/recovery-sql-compile.yml'

permissions:
  contents: read

jobs:
  unit-test-recovery-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test isolated recovery v11 crypto primitives
        run: deno test --no-check experiments/trainee-password-recovery-v11-security-primitives.review.test.ts
      - name: Test AES-GCM no-SMS code envelope
        run: deno test --no-check experiments/trainee-password-recovery-code-envelope.review.test.ts
      - name: Test delayed Auth completion and fail-closed retry barrier
        run: deno test --no-check experiments/trainee-password-recovery-auth-reconciliation.test.ts
      - name: Test definitive versus ambiguous Auth errors
        run: deno test --no-check experiments/trainee-password-recovery-auth-error-classification.test.ts
      - name: Verify pinned Supabase SDK Auth error contract
        run: deno test --no-check experiments/trainee-password-recovery-auth-sdk-contract.test.ts
      - name: Type-check recovery Edge Function and orchestration tests
        run: deno check supabase/functions/trainee-password-recovery/index.ts experiments/trainee-password-recovery-auth-reconciliation.test.ts experiments/trainee-password-recovery-auth-error-classification.test.ts experiments/trainee-password-recovery-auth-sdk-contract.test.ts experiments/trainee-password-recovery-real-gotrue.integration.test.ts


  candidate-auth-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: recovery_candidate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_candidate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: recovery_candidate_ci
    steps:
      - uses: actions/checkout@v4
      - name: Initialize isolated candidate fixture
        run: psql -v ON_ERROR_STOP=1 -f experiments/ci/recovery-postgres-fixture.sql
      - name: Apply no-SMS atomic candidate migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611230001_no_sms_recovery_atomic_candidates.sql
      - name: Apply fail-closed Auth ambiguity migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611240001_recovery_auth_ambiguity_fail_closed.sql
      - name: Prove expired lease never grants a second Auth attempt
        run: psql -v ON_ERROR_STOP=1 -f experiments/ci/recovery-auth-ambiguity-fail-closed-tests.sql

  compile-recovery-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: recovery_ci
      PGOPTIONS: '-c plpgsql.extra_warnings=all -c plpgsql.extra_errors=all'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize disposable fixture
        run: psql -v ON_ERROR_STOP=1 -f experiments/ci/recovery-postgres-fixture.sql
      - name: Apply delivery metadata draft in disposable database
        run: psql -v ON_ERROR_STOP=1 -f experiments/trainee-password-recovery-delivery-metadata-migration.review.sql
      - name: Compile core RPC draft
        run: psql -v ON_ERROR_STOP=1 -f experiments/trainee-password-recovery-core-rpcs.review.sql
      - name: Compile atomic attempt RPC draft
        run: psql -v ON_ERROR_STOP=1 -f experiments/trainee-password-recovery-atomic-attempts.review.sql
      - name: Compile delivery and finish RPC drafts
        run: psql -v ON_ERROR_STOP=1 -f experiments/trainee-password-recovery-delivery-finish-rpcs.review.sql
      - name: Assert service-role-only RPC grants
        run: |
          psql -v ON_ERROR_STOP=1 -Atc "SELECT COALESCE(bool_and(has_function_privilege('service_role', p.oid, 'EXECUTE') AND NOT has_function_privilege('anon', p.oid, 'EXECUTE') AND NOT has_function_privilege('authenticated', p.oid, 'EXECUTE')), false) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname IN ('create_trainee_recovery_request','approve_and_queue_trainee_recovery','claim_trainee_recovery_code','record_trainee_recovery_failed_attempt','record_trainee_recovery_delivery_result','finish_trainee_recovery')" | grep -qx t
      - name: Assert recovery RPC ownership, fixed search_path, and least-privilege ACLs
        run: psql -v ON_ERROR_STOP=1 -f experiments/ci/recovery-postgres-security-assertions.sql
      - name: Run lifecycle smoke tests in disposable database
        run: psql -v ON_ERROR_STOP=1 -f experiments/ci/recovery-postgres-smoke-tests.sql
      - name: Run independent-session concurrency tests (20 contenders)
        run: bash experiments/ci/recovery-postgres-concurrency-tests.sh
      - name: Compile and test no-SMS atomic attempts RPC
        run: |
          psql -v ON_ERROR_STOP=1 -f experiments/trainee-password-recovery-no-sms-atomic-attempts.review.sql
          psql -v ON_ERROR_STOP=1 -f experiments/ci/recovery-no-sms-atomic-attempts-tests.sql

  real-local-gotrue-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Create isolated local Supabase project directory
        run: |
          mkdir -p "${RUNNER_TEMP}/recovery-auth-local"
          cd "${RUNNER_TEMP}/recovery-auth-local"
          supabase init
      - name: Start disposable local Supabase stack (includes real GoTrue)
        working-directory: ${{ runner.temp }}/recovery-auth-local
        run: supabase start
      - name: Verify local Auth endpoint and run real GoTrue password lifecycle
        working-directory: ${{ runner.temp }}/recovery-auth-local
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test -n "${API_URL:-}"
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Refusing non-local Supabase Auth endpoint"; exit 1 ;;
          esac
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          deno test --no-check --allow-net --allow-env "$GITHUB_WORKSPACE/experiments/trainee-password-recovery-real-gotrue.integration.test.ts"
      - name: Stop disposable local Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -d "${RUNNER_TEMP}/recovery-auth-local/supabase" ]; then
            cd "${RUNNER_TEMP}/recovery-auth-local"
            supabase stop --no-backup || true
          else
            echo "Local Supabase project was not initialized; nothing to stop."
          fi
  local-no-sms-recovery-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Create isolated local Supabase project and install candidate-only fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/recovery-full-e2e"
          cd "${RUNNER_TEMP}/recovery-full-e2e"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/experiments/ci/no-sms-recovery-local-e2e-fixture.sql" supabase/migrations/202611220001_recovery_e2e_fixture.sql
          cp "$GITHUB_WORKSPACE/supabase/migrations/202611230001_no_sms_recovery_atomic_candidates.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/202611240001_recovery_auth_ambiguity_fail_closed.sql" supabase/migrations/
          mkdir -p supabase/functions/trainee-password-recovery
          cp "$GITHUB_WORKSPACE/supabase/functions/trainee-password-recovery/"*.ts supabase/functions/trainee-password-recovery/
      - name: Start local Supabase with real Auth and apply candidate migrations
        working-directory: ${{ runner.temp }}/recovery-full-e2e
        run: |
          supabase start
          supabase db reset --local
      - name: Serve candidate Edge Function and run trainee-coach-Auth E2E
        shell: bash
        working-directory: ${{ runner.temp }}/recovery-full-e2e
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Refusing non-local Supabase endpoint"; exit 1 ;;
          esac
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export RECOVERY_FUNCTION_URL="$API_URL/functions/v1/trainee-password-recovery"
          export RECOVERY_ALLOWED_ORIGIN="http://127.0.0.1:54321"
          export RECOVERY_NO_SMS_ENABLED="true"
          export RECOVERY_HMAC_PEPPER_B64URL="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          export RECOVERY_ENVELOPE_KEY_B64URL="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          env_file="$RUNNER_TEMP/recovery-e2e.env"
          umask 077
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nRECOVERY_NO_SMS_ENABLED=true\nRECOVERY_ALLOWED_ORIGIN=http://127.0.0.1:54321\nRECOVERY_HMAC_PEPPER_B64URL=%s\nRECOVERY_ENVELOPE_KEY_B64URL=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$SUPABASE_SERVICE_ROLE_KEY" "$RECOVERY_HMAC_PEPPER_B64URL" "$RECOVERY_ENVELOPE_KEY_B64URL" > "$env_file"
          supabase functions serve trainee-password-recovery --no-verify-jwt --env-file "$env_file" > "$RUNNER_TEMP/recovery-e2e-function.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/recovery-e2e-function.pid"
          ready=0
          for i in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$RECOVERY_FUNCTION_URL" -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:54321' -d '{}' || true)"
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          deno run --no-check --allow-net --allow-env "$GITHUB_WORKSPACE/experiments/trainee-password-recovery-local-e2e.test.ts"
      - name: Stop local Edge Function and disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/recovery-e2e-function.pid" ]; then kill "$(cat "$RUNNER_TEMP/recovery-e2e-function.pid")" || true; fi
          if [ -d "$RUNNER_TEMP/recovery-full-e2e/supabase" ]; then
            cd "$RUNNER_TEMP/recovery-full-e2e"
            supabase stop --no-backup || true
          fi
