name: Offline preview harness checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'offline-preview/**'
      - 'tests/offline-preview-static.test.mjs'
      - '.github/workflows/test-offline-preview.yml'
permissions:
  contents: read
jobs:
  static-preview-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/offline-preview-static.test.mjs
