name: TEST runner availability diagnostic
on:
  push:
    branches: ["integration/full-app-mirror-20261115"]
    paths:
      - ".github/workflows/test-runner-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner started
        run: |
          echo "TEST branch runner is available."
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
      - name: Checkout TEST branch
        uses: actions/checkout@v4
      - name: Confirm TEST app entry point exists
        run: |
          test -s index.html
          echo "index.html exists and is non-empty."
