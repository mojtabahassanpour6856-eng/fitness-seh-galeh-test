name: Deploy isolated TEST app to GitHub Pages
on:
  push:
    branches: ["main", "experiment/nutrition-builder-isolated-20261105", "integration/full-app-mirror-20261115", "fix/approved-login-images-safe-20261121"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Keep TEST Pages deployments serialized to avoid artifact/deployment races.
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST branch
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Optimize login images for web
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -quiet -q 78 -m 6 -resize 640 640 assets/auth/coach-entry.png -o assets/auth/coach-entry.webp
          cwebp -quiet -q 78 -m 6 -resize 640 640 assets/auth/trainee-entry.png -o assets/auth/trainee-entry.webp
          ls -lh assets/auth/*.webp
      - name: Upload TEST app artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy TEST app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published TEST site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status=""
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --location --max-time 30 --output "$body" --write-out '%{http_code}' "$PAGES_URL" || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Pages response not ready (attempt $attempt, HTTP ${status:-no response}); waiting..."
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::TEST Pages URL did not return HTTP 200 (last status: ${status:-no response})"
            exit 1
          fi
          grep -Fq '<title>فیتنس سه‌قلعه</title>' "$body"
          grep -Fq 'FITNESS SEH GALEH' "$body"
          grep -Fq 'auth-preview/connected-auth.js' "$body"
          auth_js="$(mktemp)"
          trap 'rm -f "$body" "$auth_js"' EXIT
          auth_status="$(curl --silent --show-error --location --max-time 30 --output "$auth_js" --write-out '%{http_code}' "${PAGES_URL}auth-preview/connected-auth.js" || true)"
          if [ "$auth_status" != "200" ]; then
            echo "::error::Connected login redesign JS failed to load (HTTP ${auth_status:-no response})"
            exit 1
          fi
          grep -Fq 'sehAuthHome' "$auth_js"
          grep -Fq 'sehAuthCoach' "$auth_js"
          grep -Fq 'sehAuthTrainee' "$auth_js"
          for asset in assets/auth/trainee-entry.webp assets/auth/coach-entry.webp; do
            asset_status="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "${PAGES_URL}${asset}" || true)"
            if [ "$asset_status" != "200" ]; then
              echo "::error::Login role image $asset failed to load (HTTP ${asset_status:-no response})"
              exit 1
            fi
          done
          grep -Fq 'udptdznbvewkublvzmtm.supabase.co' "$body"
          if grep -Fq 'qfakyudgidsumeuoqoot' "$body"; then
            echo "::error::Production Supabase ref was found in the deployed TEST HTML"
            exit 1
          fi
          echo "PASS: deployed TEST app returned HTTP 200 and contains TEST-only branding and Supabase reference."
