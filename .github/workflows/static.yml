# Approved permanent preview baseline: 4bca42e70cbf3abd519054736ded6017ee61e599
name: Deploy isolated preview to GitHub Pages
on:
  push:
    branches: ["main", "experiment/nutrition-builder-isolated-20261105", "fix/trainee-phone-auth-alias-20261126", "fix/restore-auth-images-with-phone-login-20261126", "fix/local-account-storage-isolation-20261126"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
