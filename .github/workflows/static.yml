# Safe pre-password-recovery app baseline; optimized asset generation for Pages preview.
name: Deploy isolated preview to GitHub Pages
on:
  push:
    branches: ["main", "experiment/nutrition-builder-isolated-20261105", "integration/auth-recovery-mirror-selective-2026-11-25", "diagnostics/auth-home-scroll-override-2026-11-26"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Optimize login images for mobile delivery
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate WebP login images and logo
        run: |
          npm install --prefix /tmp/auth-image-tools sharp
          NODE_PATH=/tmp/auth-image-tools/node_modules node scripts/optimize-auth-assets.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
