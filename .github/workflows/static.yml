# Approved permanent preview baseline: 4bca42e70cbf3abd519054736ded6017ee61e599
name: Deploy isolated preview to GitHub Pages
on:
  push:
    branches: ["main", "experiment/nutrition-builder-isolated-20261105", "recovery/auth-photos-scroll-2026-11-24", "test/fix-missing-profile-fields-guard-2026-11-25", "test/local-supabase-sdk-irancell-2026-11-25"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
