name: Pre-auth password recovery candidate checks
on:
  push:
    branches: ["integration/auth-recovery-mirror-selective-2026-11-25"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static security contract
        run: node tests/preauth-recovery-static.test.mjs
  deno-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check pre-auth function
        run: deno check supabase/functions/trainee-password-recovery-preauth/index.ts
