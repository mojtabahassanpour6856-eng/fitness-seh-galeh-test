name: Smart anatomy prototype checks

on:
  push:
    branches:
      - "experiment/anatomy-intensity-levels-20261127"
      - "experiment/anatomy-v2-activation-map-refine-20261127"
    paths:
      - "experiments/smart-anatomy/**"
      - "experiments/smart-anatomy-v2-chest-deltoid/**"
      - "tests/smart-anatomy-deltoid-browser.test.mjs"
      - "tests/smart-anatomy-calibration-browser.test.mjs"
      - "tests/smart-anatomy-static.test.mjs"
      - "tests/smart-anatomy-browser.test.mjs"
      - ".github/workflows/test-smart-anatomy.yml"
  pull_request:
    branches:
      - "experiment/anatomy-v2-chest-deltoid-preview-20261127"
    paths:
      - "experiments/smart-anatomy/**"
      - "experiments/smart-anatomy-v2-chest-deltoid/**"
      - "tests/smart-anatomy-deltoid-browser.test.mjs"
      - "tests/smart-anatomy-calibration-browser.test.mjs"
      - "tests/smart-anatomy-static.test.mjs"
      - "tests/smart-anatomy-browser.test.mjs"
      - ".github/workflows/test-smart-anatomy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-anatomy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anatomy-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/smart-anatomy-static.test.mjs

  anatomy-browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: node --test tests/smart-anatomy-deltoid-browser.test.mjs
      - run: node --test tests/smart-anatomy-calibration-browser.test.mjs
      - run: node --test tests/smart-anatomy-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-anatomy-browser-previews
          path: artifacts/*.png
          if-no-files-found: warn
