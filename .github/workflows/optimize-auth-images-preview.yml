name: Optimize authentication images and deploy preview
on:
  push:
    branches:
      - perf/auth-images-webp-2026-11-26
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: auth-image-optimization-preview
  cancel-in-progress: false
jobs:
  optimize-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/auth-images-webp-2026-11-26
          fetch-depth: 0
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert authentication images to WebP
        run: python scripts/optimize-auth-images.py
      - name: Remove temporary trigger
        run: rm -f optimization-preview-trigger.txt optimization-preview-trigger-2.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload optimized preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy optimized preview
        id: deployment
        uses: actions/deploy-pages@v5
