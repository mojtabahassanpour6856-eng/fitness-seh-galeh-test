name: Validate trainee progress preview
on:
  push:
    branches: ["preview/trainee-progress-20261113"]
    paths:
      - 'index.html'
      - 'tests/coach-body-analysis-layout-regression.mjs'
      - 'supabase/migrations/202611130001_atomic_trainee_progress_rpc.sql'
      - '.github/workflows/validate-inline-js.yml'
  workflow_dispatch:
jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every inline script in index.html
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script\\s*>/gi)];
          let failed = false, count = 0;
          for (const [i, match] of scripts.entries()) {
            if (/\\bsrc\\s*=/.test(match[1]) || !match[2].trim()) continue;
            count++;
            const file = `/tmp/inline-${i}.js`;
            fs.writeFileSync(file, match[2]);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              failed = true;
              console.error(result.stderr || result.stdout);
            }
          }
          console.log(`Checked ${count} inline scripts.`);
          if (failed) process.exit(1);
          NODE
      - name: Run trainee progress regression checks
        run: node tests/coach-body-analysis-layout-regression.mjs
