name: Smart Anatomy Preview

on:
  push:
    branches:
      - feature/smart-anatomy-traced-hotspots-20261119
    paths:
      - 'experiments/smart-anatomy/**'
      - '.github/workflows/smart-anatomy-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smart-anatomy-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnose preview files and Pages configuration
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          test -d experiments/smart-anatomy && echo "Preview folder exists" || echo "Preview folder missing"
          find experiments/smart-anatomy -maxdepth 2 -type f -print
          test -f experiments/smart-anatomy/index.html && echo "Index exists" || echo "Index missing"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/smart-anatomy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
