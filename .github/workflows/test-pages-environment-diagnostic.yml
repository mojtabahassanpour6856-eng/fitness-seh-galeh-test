name: TEST Pages environment diagnostic
on:
  push:
    branches: ["integration/full-app-mirror-20261115"]
    paths:
      - ".github/workflows/test-pages-environment-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment-check:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Pages environment job started
        run: echo "The github-pages environment allowed this TEST branch."
