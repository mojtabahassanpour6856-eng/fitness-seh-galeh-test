name: Deploy isolated TEST app to GitHub Pages
on:
  push:
    branches: ["integration/full-app-mirror-20261115"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST integration branch
        uses: actions/checkout@v4
      - name: Keep legacy login hidden and run redesigned entry screen last
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          guard = '''<style id="seh-auth-first-paint">html,body{background:#070b11!important}body:before{content:"";position:fixed;inset:0;background:#070b11;z-index:2147483647}#authScreen{visibility:hidden!important}</style><script>(function(){window.setTimeout(function(){var e=document.getElementById('authScreen');if(e&&!e.dataset.sehReady){document.documentElement.dataset.sehAuthLoadError='true';document.body.style.setProperty('--seh-auth-load-error','"صفحه ورود بارگذاری نشد؛ لطفاً دوباره تلاش کنید."');}},12000);})();</script>'''
          if 'seh-auth-first-paint' not in html:
              if '<head>' not in html:
                  raise SystemExit('index.html has no opening head tag')
              html = html.replace('<head>', '<head>' + guard, 1)
          # The legacy app initializes/rebuilds authTabs late in its large script.
          # Remove any earlier injected copy and move the closing tags after every
          # legacy script, then run the redesign as the final executable script.
          html = re.sub(r'<script\s+id="seh-auth-redesign-(?:early|final)"[^>]*>\s*</script>', '', html, flags=re.I)
          closing = re.search(r'</body\s*>\s*</html\s*>', html, flags=re.I)
          if not closing:
              raise SystemExit('Could not locate closing body/html tags')
          html = html[:closing.start()] + html[closing.end():]
          final_script = '<script id="seh-auth-redesign-final" src="./auth-preview/connected-auth.js?v=20261124-one-screen-v1"></script>\n'
          html = html.rstrip() + '\n' + final_script + '</body></html>\n'
          if html.rfind('seh-auth-redesign-final') < html.rfind('seh-session-accessor-terminal-override-v2'):
              raise SystemExit('Redesigned auth script was not placed after the legacy terminal scripts')
          page.write_text(html, encoding='utf-8')
          print('Prepared final auth initializer after all legacy scripts; first-paint guard remains active.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload TEST app artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages
      - name: Wait until Pages artifact is visible to the deployment API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api "repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID/artifacts" --jq '.artifacts[]? | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
              echo "Pages artifact is visible to the GitHub Actions API."
              exit 0
            fi
            echo "Pages artifact metadata is not visible yet (attempt $attempt/12); waiting 5 seconds..."
            sleep 5
          done
          echo "::error::github-pages artifact was uploaded but did not become visible to the deployment API within 60 seconds."
          exit 1
      - name: Deploy TEST app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Verify published TEST site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status=""
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --location --max-time 30 --output "$body" --write-out '%{http_code}' "$PAGES_URL" || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Pages response not ready (attempt $attempt, HTTP ${status:-no response}); waiting..."
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::TEST Pages URL did not return HTTP 200 (last status: ${status:-no response})"
            exit 1
          fi
          grep -Fq '<title>فیتنس سه‌قلعه</title>' "$body"
          grep -Fq 'FITNESS SEH GALEH' "$body"
          grep -Fq 'auth-preview/connected-auth.js' "$body"
          grep -Fq 'seh-auth-redesign-final' "$body"
          if grep -Fq 'seh-auth-redesign-early' "$body"; then
            echo "::error::An early auth initializer is still present"
            exit 1
          fi
          python - "$body" <<'PY'
          import sys
          from pathlib import Path
          html = Path(sys.argv[1]).read_text(encoding='utf-8')
          final = html.rfind('seh-auth-redesign-final')
          legacy = html.rfind('seh-session-accessor-terminal-override-v2')
          if final <= legacy:
              raise SystemExit('Final redesigned auth initializer does not follow legacy scripts')
          if html.count('seh-auth-redesign-final') != 1:
              raise SystemExit('Expected exactly one final auth initializer')
          print('PASS: redesigned auth initializer is last, after all legacy scripts.')
          PY
          auth_js="$(mktemp)"
          trap 'rm -f "$body" "$auth_js"' EXIT
          auth_status="$(curl --silent --show-error --location --max-time 30 --output "$auth_js" --write-out '%{http_code}' "${PAGES_URL}auth-preview/connected-auth.js?v=20261124-final2" || true)"
          if [ "$auth_status" != "200" ]; then
            echo "::error::Connected login redesign JS failed to load (HTTP ${auth_status:-no response})"
            exit 1
          fi
          grep -Fq 'sehAuthHome' "$auth_js"
          grep -Fq 'sehAuthCoach' "$auth_js"
          grep -Fq 'sehAuthTrainee' "$auth_js"
          for asset in assets/auth/trainee-entry.png assets/auth/coach-entry.png; do
            asset_status="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "${PAGES_URL}${asset}" || true)"
            if [ "$asset_status" != "200" ]; then
              echo "::error::Login role image $asset failed to load (HTTP ${asset_status:-no response})"
              exit 1
            fi
          done
          grep -Fq 'udptdznbvewkublvzmtm.supabase.co' "$body"
          if grep -Fq 'qfakyudgidsumeuoqoot' "$body"; then
            echo "::error::Production Supabase ref was found in the deployed TEST HTML"
            exit 1
          fi
          echo "PASS: deployed TEST app returned HTTP 200, uses TEST-only Supabase, and runs redesigned auth last."
