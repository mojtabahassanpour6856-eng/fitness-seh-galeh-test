name: Deploy isolated TEST app to GitHub Pages

on:
  push:
    branches:
      - integration/full-app-mirror-20261115
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST integration branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy TEST app
        id: deployment
        uses: actions/deploy-pages@v4
