name: Deploy isolated TEST app to GitHub Pages
on:
  push:
    branches: ["integration/full-app-mirror-20261115"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST integration branch
        uses: actions/checkout@v4
      - name: Validate unified login startup and mobile shell contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          auth = Path('auth-preview/connected-auth.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          key = 'connected-auth.js?v=20261125-fallback-guard-v1'
          assert html.count(key) == 2, 'Expected preload plus one early login script'
          assert html.index('seh-auth-redesign-early') < html.index('<div class="page">'), 'Login script must run before app body'
          assert 'seh-auth-first-paint-guard' in html, 'First-paint guard missing'
          assert 'loading="lazy"' in html, 'Nutrition iframe must not block initial page load'
          assert 'if(!window.__sehAuthRedesignConnected)buildAuthTabs();' in html, 'Legacy builder guard missing'
          assert "if(!card||window.__sehAuthRedesignConnected||document.getElementById('sehAuthHome')||document.getElementById('authTabs'))return;" in html, 'Legacy fallback must not replace the connected redesign'
          assert 'window.__sehAuthRedesignConnected=true;' in auth, 'Auth ready flag missing'
          assert "document.addEventListener('DOMContentLoaded',init,{once:true})" in auth, 'Auth script must wait until login DOM exists'
          assert 'min-height:100dvh!important' in auth, 'Login card and viewport units differ'
          assert "SHELL_CACHE_NAME = 'seh-shell-v15'" in sw, 'PWA shell cache was not invalidated'
          print('PASS: first paint, early auth, legacy guard, lazy iframe, viewport and PWA cache contracts')
          PY
      - name: Cache-bust restored approved login screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          expected = 'connected-auth.js?v=20261125-fallback-guard-v1'
          if s.count(expected) != 2:
              raise SystemExit('Expected exactly one preload and one early login script reference.')
          if 'connected-auth.js?v=20261124-scroll-fix-v2' in s:
              raise SystemExit('A stale terminal login script reference remains.')
          print('Verified one preloaded and one early approved login script reference.')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload TEST app artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Wait until Pages artifact is visible to the deployment API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api "repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID/artifacts" --jq '.artifacts[]? | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
              echo "Pages artifact is visible to the GitHub Actions API."
              exit 0
            fi
            echo "Pages artifact metadata is not visible yet (attempt $attempt/12); waiting 5 seconds..."
            sleep 5
          done
          echo "::error::github-pages artifact was uploaded but did not become visible to the deployment API within 60 seconds."
          exit 1
      - name: Deploy TEST app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published TEST site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status=""
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --location --max-time 30 --output "$body" --write-out '%{http_code}' "$PAGES_URL" || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Pages response not ready (attempt $attempt, HTTP ${status:-no response}); waiting..."
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::TEST Pages URL did not return HTTP 200 (last status: ${status:-no response})"
            exit 1
          fi
          grep -Fq '<title>فیتنس سه‌قلعه</title>' "$body"
          grep -Fq 'FITNESS SEH GALEH' "$body"
          grep -Fq 'auth-preview/connected-auth.js?v=20261125-fallback-guard-v1' "$body"
          grep -Fq 'seh-auth-first-paint-guard' "$body"
          grep -Fq 'loading="lazy"' "$body"
          grep -Fq 'if(!window.__sehAuthRedesignConnected)buildAuthTabs();' "$body"
          grep -Fq "document.addEventListener('DOMContentLoaded',init,{once:true})" "$auth_js"
          grep -Fq "if(!card||window.__sehAuthRedesignConnected||document.getElementById('sehAuthHome')||document.getElementById('authTabs'))return;" "$body"
          auth_js="$(mktemp)"
          sw_body="$(mktemp)"
          trap 'rm -f "$body" "$auth_js" "$sw_body"' EXIT
          sw_status="$(curl --silent --show-error --location --max-time 30 --output "$sw_body" --write-out '%{http_code}' "${PAGES_URL}sw.js" || true)"
          if [ "$sw_status" != "200" ]; then
            echo "::error::Published TEST service worker failed to load (HTTP ${sw_status:-no response})"
            exit 1
          fi
          grep -Fq "SHELL_CACHE_NAME = 'seh-shell-v15'" "$sw_body"
          auth_status="$(curl --silent --show-error --location --max-time 30 --output "$auth_js" --write-out '%{http_code}' "${PAGES_URL}auth-preview/connected-auth.js?v=20261125-fallback-guard-v1" || true)"
          if [ "$auth_status" != "200" ]; then
            echo "::error::Connected login redesign JS failed to load (HTTP ${auth_status:-no response})"
            exit 1
          fi
          grep -Fq 'sehAuthHome' "$auth_js"
          grep -Fq 'sehAuthCoach' "$auth_js"
          grep -Fq 'sehAuthTrainee' "$auth_js"
          grep -Fq 'height:100dvh!important' "$auth_js"
          grep -Fq 'touch-action:pan-y!important' "$auth_js"
          grep -Fq -- '-webkit-overflow-scrolling:touch!important' "$auth_js"
          grep -Fq 'overscroll-behavior-y:contain!important' "$auth_js"
          grep -Fq 'overflow-y:auto!important' "$auth_js"
          grep -Fq 'overflow:visible!important;touch-action:pan-y!important' "$auth_js"
          for asset in assets/auth/trainee-entry.png assets/auth/coach-entry.png; do
            asset_status="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "${PAGES_URL}${asset}" || true)"
            if [ "$asset_status" != "200" ]; then
              echo "::error::Login role image $asset failed to load (HTTP ${asset_status:-no response})"
              exit 1
            fi
          done
          grep -Fq 'udptdznbvewkublvzmtm.supabase.co' "$body"
          if grep -Fq 'qfakyudgidsumeuoqoot' "$body"; then
            echo "::error::Production Supabase ref was found in the deployed TEST HTML"
            exit 1
          fi
          echo "PASS: deployed TEST app returned HTTP 200 and contains TEST-only branding and Supabase reference."
