name: GitHub Pages environment diagnostic
on:
  push:
    branches: ["diagnostic/hosted-runner-20261126"]
permissions:
  contents: read
jobs:
  environment-check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 2
    steps:
      - name: Confirm environment job start
        run: echo "GITHUB_PAGES_ENVIRONMENT_JOB_STARTED"
