<head>

<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#242424,#090909 65%);color:#f8f5ed;font-family:Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(100%,1000px);text-align:center}.brand{color:#d9b66a;font-size:clamp(22px,4vw,34px);font-weight:800;letter-spacing:.5px}.subtitle{color:#c9c3b7;margin:10px 0 26px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{position:relative;overflow:hidden;border:1px solid #b38b43;border-radius:18px;min-height:430px;background:#111;box-shadow:0 12px 35px #0008;display:flex;align-items:flex-end;text-decoration:none;color:white}
.card img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;object-position:center;transition:transform .35s}.card:hover img{transform:scale(1.035)}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.94),rgba(0,0,0,.08) 65%,rgba(0,0,0,.15))}
.caption{position:relative;z-index:1;padding:25px;width:100%;text-align:right}.caption h2{margin:0 0 8px;color:#e5c47c;font-size:26px}.caption p{margin:0;color:#f0e9dc;font-size:14px}.button{display:inline-block;margin-top:16px;border:1px solid #d3ae62;border-radius:30px;padding:10px 22px;background:linear-gradient(120deg,#9e762e,#e2c47d);color:#15120b;font-weight:bold}
.note{font-size:12px;color:#9e9789;margin-top:16px}
@media(max-width:650px){.cards{grid-template-columns:1fr}.card{min-height:380px}.wrap{max-width:460px}}
</style></head><body><main class="wrap">
